<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>

<body>

<!-- HERO (bild + header) -->
<div class="hero">
  <div id="image-bg"></div>
  <div class="blob"></div>

  <div class="header">
    <div>
      <div id="time"></div>
      <div id="date"></div>
    </div>
    <canvas id="qr"></canvas>
  </div>
</div>

<!-- CONTENT -->
<div class="content">

  <div class="grid">

    <!-- KOM IHÅG -->
    <div class="box" onclick="openPopup('komIhag')">
      <ul id="komihag-list"></ul>
    </div>

    <!-- RUTINER -->
    <div class="box pink" onclick="openPopup('rutiner')">
      <ul id="rutiner-list"></ul>
    </div>

    <!-- ATT GÖRA -->
    <div class="box" onclick="openPopup('attGora')">
      <ul id="attgora-list"></ul>
    </div>

    <!-- EXTRA -->
    <div class="box" onclick="openPopup('extra')">
      <ul id="extra-list"></ul>
    </div>

  </div>

  <!-- KALENDER -->
  <div class="calendar-wrapper">
    <iframe
      class="calendar"
      src="https://calendar.google.com/calendar/embed?mode=AGENDA&src=ericssonbonini%40gmail.com&ctz=Europe%2FStockholm">
    </iframe>
  </div>

</div>

<!-- POPUP -->
<div id="popup" class="popup hidden">
  <div class="popup-card">
    <h3 id="popup-title"></h3>

    <ul id="popup-list"></ul>

    <div class="input-row">
      <input id="popup-input" placeholder="Lägg till..." />
      <button onclick="addItem()">＋</button>
    </div>

    <button class="close" onclick="closePopup()">Stäng</button>
  </div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
