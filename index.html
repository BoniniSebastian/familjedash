<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Family Dashboard</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="blob"></div>

<div class="header">
  <div class="time" id="time"></div>
  <div class="date" id="date"></div>
</div>

<div class="grid">

  <div class="box weather-box">
    <div id="weather"></div>
    <div id="forecast"></div>
  </div>

  <div class="box pink" onclick="openPopup('komIhag')">
    <ul id="komihag-list"></ul>
  </div>

  <div class="box" onclick="openPopup('rutiner')">
    <ul id="rutiner-list"></ul>
  </div>

  <div class="box" onclick="openPopup('attGora')">
    <ul id="attgora-list"></ul>
  </div>

</div>

<div id="image-section"></div>

<canvas id="qr"></canvas>

<iframe
  class="calendar"
  src="https://calendar.google.com/calendar/embed?mode=AGENDA&src=ericssonbonini%40gmail.com&ctz=Europe%2FStockholm">
</iframe>

<!-- POPUP -->
<div id="popup" class="popup hidden">
  <div class="popup-content">
    <h3 id="popup-title"></h3>
    <ul id="popup-list"></ul>

    <input id="popup-input" placeholder="Skriv..." />
    <button onclick="addItem()">+</button>

    <button onclick="closePopup()">Stäng</button>
  </div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
