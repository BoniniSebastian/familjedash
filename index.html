<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Dashboard</title>
<link rel="stylesheet" href="style.css">

<!-- QR FIX -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

</head>

<body>

<div class="blob"></div>

<div class="header">
  <div id="time"></div>
  <div id="date"></div>
</div>

<div class="grid">

  <div class="box" id="weather-box">
    <div id="weather-main"></div>
    <div id="forecast"></div>
  </div>

  <div class="box pink">
    <ul id="komihag-list"></ul>
  </div>

  <div class="box">
    <ul id="rutiner-list"></ul>
  </div>

  <div class="box">
    <ul id="attgora-list"></ul>
  </div>

</div>

<div id="image-section"></div>

<canvas id="qr"></canvas>

<iframe class="calendar"
src="https://calendar.google.com/calendar/embed?mode=AGENDA&src=ericssonbonini%40gmail.com&ctz=Europe%2FStockholm">
</iframe>

<script type="module" src="app.js"></script>
</body>
</html>
