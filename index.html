<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Family Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date">—</div>
    <div class="weather">Värmdö • —°</div>
  </div>

  <!-- GRID (4 rutor) -->
  <div class="grid">

    <!-- KOM IHÅG -->
    <div class="box" onclick="openPopup('komihag')">
      <div class="box-title">Kom ihåg</div>
      <ul id="komihag-list" class="list"></ul>
      <div id="komihag-more" class="more"></div>
    </div>

    <!-- RUTINER -->
    <div class="box">
      <div class="box-title">Rutiner</div>
      <ul class="list">
        <li>21.00 Borsta tänderna</li>
        <li>21.30 Släck lampan</li>
      </ul>
    </div>

    <!-- ATT GÖRA -->
    <div class="box" onclick="openPopup('attgora')">
      <div class="box-title">Att göra</div>
      <ul id="attgora-list" class="list"></ul>
      <div id="attgora-more" class="more"></div>
    </div>

    <!-- TOM / RESERVERAD -->
    <div class="box">
      <div class="box-title">—</div>
      <div class="placeholder"> </div>
    </div>

  </div>

  <!-- BILDSEKTION -->
  <div id="image-section"></div>

  <!-- KALENDER (iframe) -->
  <iframe
    class="calendar"
    src="https://calendar.google.com/calendar/embed?src=ericssonbonini%40gmail.com&ctz=Europe%2FStockholm"
  ></iframe>

  <!-- POPUP -->
  <div id="popup" class="popup hidden">
    <div class="popup-content">
      <div class="popup-header">
        <h3 id="popup-title">—</h3>
        <button class="close" onclick="closePopup()">✕</button>
      </div>

      <ul id="popup-list" class="popup-list"></ul>

      <div class="popup-input-row">
        <input id="popup-input" placeholder="Skriv..." />
        <button onclick="addItem()">+</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
