<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Min Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="hero">
  <div id="image-bg"></div>
  <div class="blob"></div>

  <div class="header">
    <div class="header-left">
      <div id="time"></div>
      <div id="date"></div>
    </div>

    <div class="weather-top">
      <div id="weather-icon"></div>
      <div>
        <div id="weather-main"></div>
        <div id="weather-feels"></div>
        <div id="forecast"></div>
      </div>
    </div>
  </div>
</div>

<div class="content">

  <div class="main-column">

    <div class="box" onclick="openPopup('komIhag')">
      <ul id="komihag-list"></ul>
    </div>

    <div class="box" onclick="openPopup('attGora')">
      <ul id="attgora-list"></ul>
    </div>

    <div class="calendar-wrapper">
      <iframe
        class="calendar"
        src="https://calendar.google.com/calendar/embed?mode=AGENDA&src=ericssonbonini%40gmail.com&ctz=Europe%2FStockholm">
      </iframe>
    </div>

  </div>

</div>

<div id="popup" class="popup hidden">
  <div class="popup-card">

    <ul id="popup-list"></ul>

    <div class="input-row">
      <input id="popup-input" placeholder="Lägg till..." />
      <button onclick="addItem()">＋</button>
    </div>

    <button class="close" onclick="closePopup()">Stäng</button>
  </div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
