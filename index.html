<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>

<body>

<div class="blob"></div>

<div class="header">
  <div>
    <div id="time"></div>
    <div id="date"></div>
  </div>
  <canvas id="qr"></canvas>
</div>

<div class="grid">

  <!-- VÄDER -->
  <div class="box" id="weather-box">
    <div id="weather-main"></div>
    <div id="weather-feels"></div>
    <div id="forecast"></div>
  </div>

  <!-- KOM IHÅG -->
  <div class="box pink" onclick="openPopup('komIhag')">
    <ul id="komihag-list"></ul>
  </div>

  <!-- RUTINER -->
  <div class="box" onclick="openPopup('rutiner')">
    <ul id="rutiner-list"></ul>
  </div>

  <!-- ATT GÖRA -->
  <div class="box" onclick="openPopup('attGora')">
    <ul id="attgora-list"></ul>
  </div>

</div>

<div id="image-section"></div>

<div class="calendar-wrapper">
  <iframe class="calendar"
  src="https://calendar.google.com/calendar/embed?mode=AGENDA&src=ericssonbonini%40gmail.com&ctz=Europe%2FStockholm">
  </iframe>
</div>

<!-- POPUP -->
<div id="popup" class="popup hidden">
  <div class="popup-content">
    <h3 id="popup-title"></h3>

    <ul id="popup-list"></ul>

    <input id="popup-input" placeholder="Skriv..." />
    <button onclick="addItem()">Lägg till</button>
    <button onclick="closePopup()">Stäng</button>
  </div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
